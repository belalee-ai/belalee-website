<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳循环一周规划 · Carb Cycle Planner</title>
<style>
  :root {
    --lime-1: #d4f23f;
    --lime-2: #8fd14f;
    --green-text: #4d7c0f;
    --green-deep: #3f6212;
    --tint-1: #f7fce0;
    --tint-2: #ecf7dd;
    --ink: #111111;
    --paper: #ffffff;
    --grid: #e5e5e5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Noto Sans SC", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    padding: 0 24px 64px;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* ---------- header ---------- */
  header {
    padding: 40px 0 24px;
    border-bottom: 3px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  header h1 .accent {
    background: linear-gradient(90deg, var(--lime-1), var(--lime-2));
    padding: 0 8px;
  }
  header .sub { font-size: 13px; color: #555; letter-spacing: 2px; text-transform: uppercase; }

  /* ---------- inputs ---------- */
  .panel {
    margin-top: 28px;
    border: 2px solid var(--ink);
  }
  .panel-title {
    background: var(--ink);
    color: var(--lime-1);
    font-size: 13px;
    letter-spacing: 3px;
    padding: 8px 14px;
    font-weight: 700;
  }
  .inputs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 0;
  }
  .field {
    padding: 12px 14px;
    border-right: 1px solid var(--grid);
    border-top: 1px solid var(--grid);
  }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 1px;
    color: #666;
    margin-bottom: 4px;
  }
  .field input, .field select {
    width: 100%;
    border: none;
    border-bottom: 2px solid var(--ink);
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    padding: 2px 0;
    background: transparent;
    color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: none; border-bottom-color: var(--green-text); }

  .schedule {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--grid);
  }
  .schedule .day-pick {
    padding: 10px 8px;
    border-right: 1px solid var(--grid);
    text-align: center;
  }
  .schedule .day-pick:last-child { border-right: none; }
  .schedule .day-pick .dname { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .schedule select { width: 100%; font-size: 13px; font-family: inherit; border: 1px solid var(--ink); padding: 3px 2px; background: var(--paper); }

  /* ---------- week cards ---------- */
  .week {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    border: 2px solid var(--ink);
    background: var(--paper);
    display: flex;
    flex-direction: column;
  }
  .card.high { background: linear-gradient(160deg, var(--tint-1), var(--tint-2)); }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 2px solid var(--ink);
  }
  .card-head .dayname { font-size: 16px; font-weight: 800; }
  .badge {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 3px 10px;
    border: 2px solid var(--ink);
  }
  .badge.high { background: var(--lime-1); }
  .badge.mid  { background: var(--paper); }
  .badge.low  { background: var(--ink); color: var(--lime-1); }
  .kcal-row {
    padding: 12px 14px 4px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .kcal-row .num { font-size: 38px; font-weight: 800; letter-spacing: -1px; }
  .kcal-row .unit { font-size: 12px; color: #666; }
  .kcal-row .ttype { margin-left: auto; font-size: 12px; color: var(--green-deep); font-weight: 700; }
  .macros {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin: 8px 14px 0;
    border: 1px solid var(--ink);
  }
  .macros div {
    text-align: center;
    padding: 8px 4px;
    border-right: 1px solid var(--ink);
  }
  .macros div:last-child { border-right: none; }
  .macros .g { font-size: 20px; font-weight: 800; }
  .macros .lbl { font-size: 11px; color: #666; letter-spacing: 1px; }
  .macros .carb { background: linear-gradient(180deg, var(--lime-1), var(--lime-2)); }
  .sweet {
    margin: 10px 14px 0;
    font-size: 12.5px;
    background: var(--ink);
    color: var(--lime-1);
    padding: 7px 10px;
    font-weight: 600;
  }
  .hint {
    margin: 10px 14px 0;
    font-size: 12.5px;
    color: var(--green-deep);
    border-left: 3px solid var(--lime-2);
    padding-left: 8px;
  }
  details {
    margin: 12px 14px 12px;
  }
  details summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: var(--green-text);
  }
  details summary:hover { color: var(--green-deep); }
  .meals { font-size: 13px; margin-top: 8px; }
  .meals li { margin: 6px 0 6px 18px; }
  .meals b { color: var(--green-deep); }
  .rest-toggle {
    margin-top: auto;
    border-top: 1px solid var(--ink);
    padding: 8px 14px;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .rest-toggle input { accent-color: var(--green-text); width: 16px; height: 16px; cursor: pointer; }

  /* ---------- summary ---------- */
  .summary {
    margin-top: 28px;
    border: 2px solid var(--ink);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }
  .summary .cell {
    padding: 16px 14px;
    border-right: 1px solid var(--ink);
  }
  .summary .cell:last-child { border-right: none; }
  .summary .big { font-size: 28px; font-weight: 800; }
  .summary .lbl { font-size: 11px; letter-spacing: 1px; color: #666; }
  .disclaimer {
    margin-top: 20px;
    font-size: 12px;
    color: #777;
    border-top: 1px solid var(--grid);
    padding-top: 12px;
  }
  @media (max-width: 720px) {
    .schedule { grid-template-columns: repeat(4, 1fr); }
    .schedule .day-pick { border-bottom: 1px solid var(--grid); }
  }
</style>
</head>
<body>

<header>
  <h1>碳循环 <span class="accent">一周规划</span></h1>
  <div class="sub">Carb Cycle Planner · Swiss Edition</div>
</header>

<div class="panel">
  <div class="panel-title">01 — 我的数据（自动保存在本浏览器）</div>
  <div class="inputs" id="inputs">
    <div class="field"><label>性别</label>
      <select id="sex"><option value="f">女</option><option value="m">男</option></select></div>
    <div class="field"><label>年龄</label><input id="age" type="number" min="14" max="90"></div>
    <div class="field"><label>身高 cm</label><input id="height" type="number" min="120" max="220"></div>
    <div class="field"><label>体重 kg（每周更新）</label><input id="weight" type="number" step="0.1" min="30" max="200"></div>
    <div class="field"><label>体脂率 %（选填）</label><input id="bodyfat" type="number" step="0.5" min="5" max="60" placeholder="不知道可留空"></div>
    <div class="field"><label>目标</label>
      <select id="goal">
        <option value="cut_keep">减脂保肌</option>
        <option value="cut">纯减脂</option>
        <option value="bulk">增肌</option>
      </select></div>
    <div class="field"><label>单次力量消耗 kcal</label><input id="skcal" type="number" step="50" min="0" max="1500"></div>
    <div class="field"><label>单次有氧消耗 kcal</label><input id="ckcal" type="number" step="50" min="0" max="1500"></div>
  </div>
  <div class="panel-title">02 — 一周课表（哪天练什么）</div>
  <div class="schedule" id="schedule"></div>
</div>

<div class="week" id="week"></div>

<div class="summary" id="summary"></div>

<p class="disclaimer">
  ⚠️ 本工具为饮食<strong>预估参考</strong>，不是医嘱。所有数字以你实际执行两周后的体重与状态变化来校准：
  两周体重纹丝不动 → 各档热量下调 5–8%；掉得太快（&gt;0.7kg/周）或训练没力气 → 上调。忌口：示例已排除猪肉。
</p>

<script>
/* ================= 数据 ================= */
const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
const DEFAULTS = {
  sex: 'f', age: 29, height: 158, weight: 55.1, bodyfat: 25,
  goal: 'cut_keep', skcal: 500, ckcal: 500,
  // 周一力量 / 周二有氧 / 周三力量 / 周四有氧 / 周五力量 / 周六休息 / 周日有氧
  plan: ['strength','cardio','strength','cardio','strength','rest','cardio'],
  restToday: [false,false,false,false,false,false,false],
};
const STORE_KEY = 'carb-cycle-v1';

const GOALS = {
  cut_keep: { adj: { high: -0.10, mid: -0.15, low: -0.22 }, protein: 2.0,
              carb: { high: 3.6, mid: 2.2, low: 1.0 } },
  cut:      { adj: { high: -0.15, mid: -0.20, low: -0.27 }, protein: 2.0,
              carb: { high: 3.0, mid: 1.8, low: 0.8 } },
  bulk:     { adj: { high: +0.10, mid: +0.05, low: 0 },     protein: 1.8,
              carb: { high: 4.5, mid: 3.0, low: 1.5 } },
};
const TIER_OF = { strength: 'high', cardio: 'mid', rest: 'low' };
const TIER_NAME = { high: '高碳日', mid: '中碳日', low: '低碳日' };
const TYPE_NAME = { strength: '🏋️ 力量训练', cardio: '🏃 有氧', rest: '😴 休息' };

let state = load();

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && saved.plan && saved.plan.length === 7) return { ...DEFAULTS, ...saved };
  } catch (e) { /* 损坏则回默认 */ }
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ================= 计算 ================= */
function bmr(s) {
  const w = +s.weight, h = +s.height, a = +s.age, bf = parseFloat(s.bodyfat);
  if (!isNaN(bf) && bf > 0) return 370 + 21.6 * w * (1 - bf / 100);   // Katch-McArdle
  return 10 * w + 6.25 * h - 5 * a + (s.sex === 'm' ? 5 : -161);      // Mifflin-St Jeor
}

function dayCalc(s, type) {
  const g = GOALS[s.goal];
  const w = +s.weight;
  const base = bmr(s) * 1.3
    + (type === 'strength' ? +s.skcal : type === 'cardio' ? +s.ckcal : 0);
  const tier = TIER_OF[type];
  let target = base * (1 + g.adj[tier]);
  target = Math.max(target, bmr(s) * 0.95);          // 热量下限：不低于基础代谢的 95%

  const P = g.protein * w;                            // 蛋白质固定
  let C = g.carb[tier] * w;                           // 碳水起算值
  let F = (target - P * 4 - C * 4) / 9;               // 脂肪 = 剩余热量
  const fMin = 0.75 * w, fMax = 1.35 * w;
  const Fc = Math.min(Math.max(F, fMin), fMax);       // 夹在安全区间
  if (Fc !== F) {                                     // 差额回补/扣减到碳水
    C = Math.max(30, (target - P * 4 - Fc * 9) / 4);
    F = Fc;
  }
  const kcal = P * 4 + C * 4 + F * 9;                 // 实际展示热量
  return { tier, kcal: Math.round(kcal), tdee: Math.round(base),
           P: Math.round(P), C: Math.round(C), F: Math.round(F) };
}

/* ================= 三餐示例 ================= */
/* 直观换算：米饭1拳(熟150g)≈40g碳 · 燕麦50g≈30g碳 · 红薯150g≈35g碳
   鸡蛋1个≈6g蛋白 · 鸡胸/鱼虾/牛肉1手掌(100g)≈20g蛋白 · 希腊酸奶100g≈10g蛋白 */
function meals(d, type) {
  const fist = n => (Math.round(n * 2) / 2).toFixed(1).replace('.0', '');
  const sweetCarb = (type === 'strength') ? 45 : 0;          // 高碳日甜品额度 ≤180kcal ≈ 45g碳
  const mainCarb = Math.max(d.C - 30 - sweetCarb, 40);       // 扣掉早餐燕麦30g与甜品后由主食承担
  const lunchFist = fist(mainCarb * 0.55 / 40);
  const dinnerFist = fist(mainCarb * 0.45 / 40);
  const palm = Math.max(1, Math.round((d.P - 22) / 20 / 2 * 2) / 2); // 早餐约22g蛋白后每餐手掌数

  const m = [];
  m.push(`<b>早餐</b>：燕麦 50g + 鸡蛋 2 个 + 希腊酸奶 100g${d.tier === 'high' ? ' + 水果 1 个' : ''}`);
  m.push(`<b>午餐</b>：米饭 ${lunchFist} 拳（熟）+ 鸡胸/牛肉 1 手掌 + 蔬菜 2 拳 + 橄榄油 1 勺`);
  m.push(`<b>晚餐</b>：红薯/米饭 ${dinnerFist} 拳 + 鱼虾 ${palm > 1 ? '1.5' : '1'} 手掌 + 绿叶菜不限`);
  if (d.tier === 'low') {
    m.push(`<b>加餐</b>：坚果 1 小把 / 无糖酸奶（脂肪额度在这里）`);
  } else if (type === 'strength') {
    m.push(`<b>练后加餐</b>：香蕉 1 根 / 蛋白粉 1 勺（练完 1 小时内吃，碳水利用率最高）`);
  } else {
    m.push(`<b>加餐</b>：水果 1 个 / 坚果 1 小把`);
  }
  return m;
}

/* ================= 渲染 ================= */
function render() {
  // 课表选择器
  const sched = document.getElementById('schedule');
  sched.innerHTML = DAYS.map((d, i) => `
    <div class="day-pick">
      <div class="dname">${d}</div>
      <select data-day="${i}" class="plan-sel">
        <option value="strength" ${state.plan[i] === 'strength' ? 'selected' : ''}>力量</option>
        <option value="cardio"   ${state.plan[i] === 'cardio' ? 'selected' : ''}>有氧</option>
        <option value="rest"     ${state.plan[i] === 'rest' ? 'selected' : ''}>休息</option>
      </select>
    </div>`).join('');

  // 7 张日卡
  const week = document.getElementById('week');
  const results = [];
  week.innerHTML = DAYS.map((d, i) => {
    const type = state.restToday[i] ? 'rest' : state.plan[i];
    const r = dayCalc(state, type);
    results.push(r);
    const sweetBox = (type === 'strength')
      ? `<div class="sweet">🍰 计划内甜品额度 ≤180 kcal（已计入碳水）— 想吃甜的，留到今天</div>` : '';
    const lowHint = (r.tier === 'low')
      ? `<div class="hint">今天最难熬。晚上想吃甜的 → 看一眼明天：高碳日就在前面。</div>` : '';
    return `
    <div class="card ${r.tier}">
      <div class="card-head">
        <span class="dayname">${d}</span>
        <span class="badge ${r.tier}">${TIER_NAME[r.tier]}</span>
      </div>
      <div class="kcal-row">
        <span class="num">${r.kcal}</span><span class="unit">kcal</span>
        <span class="ttype">${state.restToday[i] ? '😴 临时休息' : TYPE_NAME[type]}</span>
      </div>
      <div class="macros">
        <div class="carb"><div class="g">${r.C}g</div><div class="lbl">碳水</div></div>
        <div><div class="g">${r.P}g</div><div class="lbl">蛋白质</div></div>
        <div><div class="g">${r.F}g</div><div class="lbl">脂肪</div></div>
      </div>
      ${sweetBox}${lowHint}
      <details>
        <summary>怎么吃（示例，可按克数自由替换）</summary>
        <ul class="meals">${meals(r, type).map(x => `<li>${x}</li>`).join('')}</ul>
      </details>
      <label class="rest-toggle">
        <input type="checkbox" data-rest="${i}" ${state.restToday[i] ? 'checked' : ''}>
        今天临时休息（降为低碳日）
      </label>
    </div>`;
  }).join('');

  // 周汇总
  const avgKcal = Math.round(results.reduce((s, r) => s + r.kcal, 0) / 7);
  const avgTdee = Math.round(results.reduce((s, r) => s + r.tdee, 0) / 7);
  const weeklyDef = (avgTdee - avgKcal) * 7;
  const loss = weeklyDef / 7700;
  const defPct = Math.round((avgTdee - avgKcal) / avgTdee * 100);
  document.getElementById('summary').innerHTML = `
    <div class="cell"><div class="big">${Math.round(bmr(state))}</div><div class="lbl">基础代谢 kcal</div></div>
    <div class="cell"><div class="big">${avgTdee}</div><div class="lbl">日均总消耗 kcal</div></div>
    <div class="cell"><div class="big">${avgKcal}</div><div class="lbl">日均摄入 kcal</div></div>
    <div class="cell"><div class="big">${defPct > 0 ? '−' + defPct + '%' : '+' + (-defPct) + '%'}</div><div class="lbl">周平均${defPct > 0 ? '缺口' : '盈余'}</div></div>
    <div class="cell"><div class="big">${loss > 0 ? loss.toFixed(2) : (-loss).toFixed(2)} kg</div><div class="lbl">预计每周${loss > 0 ? '减重' : '增重'}</div></div>`;

  bindEvents();
}

function bindEvents() {
  document.querySelectorAll('.plan-sel').forEach(el =>
    el.addEventListener('change', e => {
      state.plan[+e.target.dataset.day] = e.target.value;
      save(); render();
    }));
  document.querySelectorAll('[data-rest]').forEach(el =>
    el.addEventListener('change', e => {
      state.restToday[+e.target.dataset.rest] = e.target.checked;
      save(); render();
    }));
}

// 顶部输入
['sex','age','height','weight','bodyfat','goal','skcal','ckcal'].forEach(id => {
  const el = document.getElementById(id);
  el.value = state[id] ?? '';
  el.addEventListener('input', () => {
    state[id] = el.value;
    save(); render();
  });
});

render();
</script>
</body>
</html>
